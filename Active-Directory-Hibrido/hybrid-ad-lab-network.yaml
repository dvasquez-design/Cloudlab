Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: hybrid-ad-lab-vpc-id }
  PublicSubnetId:
    Value: !Ref PublicSubnet
    Export: { Name: hybrid-ad-lab-public-subnet-id }
  PrivateSubnetId:
    Value: !Ref PrivateSubnet
    Export: { Name: hybrid-ad-lab-private-subnet-id }
  GatewayWanPublicIp:
    Description: IP publica fija del gateway - Endpoint del peer en Wonderland
    Value: !Ref GatewayWanEip
  GatewayInstanceId:
    Value: !Ref GatewayInstance
  PrivateSecurityGroupId:
    Description: SG a asignar a las instancias Ubuntu cliente
    Value: !Ref PrivateSecurityGroup
  WgServerPublicKeyNote:
    Value: >-
      La clave publica del server nace en el primer boot, no esta disponible
      como Output. Obtenerla por SSM en el gateway con:
      sudo cat /etc/wireguard/server_public.key
      Con ese valor armar el [Peer] de Wonderland (wg-hybrid.conf).
  ClientsDeployed:
    Value: !Ref DeployClients
  PostDeployNote:
    Value: >-
      1) Asignar LabInstanceProfile al gateway y a cada cliente (Modify IAM role) y reiniciar.
      2) Levantar wg-hybrid en Wonderland y arrancar win-dc01.
      3) En cada cliente (SSM), cuando exista /var/lib/clone-ready:
      sudo dept-config.sh (lee /etc/lab-dept).
